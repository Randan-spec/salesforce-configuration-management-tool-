resources:
  - type: package
    name: apache2
    state: present
    notify: ["service:apache2"]

  - type: package
    name: libapache2-mod-php
    state: present
    notify: ["service:apache2"]

  - type: package
    name: libapache2-mod-php
    state: present
    notify: ["service:apache2"]

  - type: file
    path: /var/www/html/index.php
    source: files/app/index.php
    owner: www-data
    group: www-data
    mode: "644"
    backup: true
    notify: ["service:apache2"]

  - type: file
    path: /etc/apache2/mods-enabled/dir.conf
    content: |
      <IfModule mod_dir.c>
          DirectoryIndex index.php index.html index.cgi index.pl index.xhtml index.htm
      </IfModule>
    owner: root
    group: root
    mode: "644"
    notify: ["service:apache2"]

  - type: file
    path: /etc/apache2/sites-available/000-default.conf
    content: |
      <VirtualHost *:80>
          DocumentRoot /var/www/html
          <Directory /var/www/html>
              AllowOverride None
              Require all granted
          </Directory>
      </VirtualHost>
    owner: root
    group: root
    mode: "644"
    notify: ["service:apache2"]

  - type: service
    name: apache2
    ensure: started
    enable: true
